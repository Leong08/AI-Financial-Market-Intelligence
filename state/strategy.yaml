version: "02"
asset: "XAU/USD"

# Tier 1: Single-Timeframe Voter Fuzzification Parameters
fuzzification:
  k_rsi: 0.15
  k_cci: 0.02
  delta_stoch_k: 0.10
  delta_stoch_s: 0.08
  lambda_mom: 2.0

# Tier 1: Voter Authority Discount Weights (sum = 1.0)
voter_weights:
  rsi: 0.20
  cci: 0.20
  stoch: 0.20
  macd: 0.20
  mom: 0.20

# Tier 2: Base Inter-Timeframe Weight Matrix W_base
timeframe_weights:
  M15: 0.15
  M5: 0.10
  M1: 0.05

# Tier 2: Macro Trend Veto Gate Thresholds
macro_veto:
  veto_trigger_threshold: 0.75   # Penalizes when opposing belief exceeds this
  veto_pass_threshold: 0.10      # Final penalty multiplier must pass this floor

# Global Decision Engine Thresholds
decision_rules:
  delta_signal: 0.35             # Minimum confidence score required to enter
  delta_margin: 0.08             # Minimum advantage spread between BUY and SELL
  psi_max: 0.75                  # Maximum allowable cross-timeframe conflict